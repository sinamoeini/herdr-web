[package]
name = "herdr-web"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "signal", "sync", "time"] }
portable-pty = "=0.9.0"
serde_json = "=1.0.154"
libc = "=0.2.191"
base64 = "=0.22.1"
