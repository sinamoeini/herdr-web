name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  single-commit:
    name: Single-commit PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require exactly one commit
        env:
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          if [ "$PR_COMMIT_COUNT" != "1" ]; then
            echo "::error::Pull requests must contain exactly one commit (found $PR_COMMIT_COUNT). Squash your commits and force-push with --force-with-lease."
            exit 1
          fi
          echo "Pull request contains exactly one commit."

  acceptance:
    name: Linux acceptance
    uses: ./.github/workflows/acceptance.yml

  python:
    name: Assets, packaging, and logic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Run local unit and provenance checks
        run: python3 -m unittest discover -s test -p 'test_*.py' -v
      - name: Validate source plugin manifest
        run: python3 test/plugin.py --manifest-only
      - name: Check shell syntax
        run: |
          sh -n build.sh
          sh -n tools/install.sh

  rust:
    name: Linux Rust build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup show active-toolchain
      - name: Run locked Rust tests
        run: cargo test --locked --workspace
      - name: Build release executable
        run: ./build.sh
      - name: Package Linux executable
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("server/Cargo.toml", "rb"))["package"]["version"])')
          python3 tools/package_release.py --tag "v$version"
          cd dist
          sha256sum --check SHA256SUMS
          tar -xzf "herdr-web-v$version-x86_64-unknown-linux-gnu.tar.gz"
          cd "herdr-web-v$version-x86_64-unknown-linux-gnu"
          ./herdr-web --help

  docker:
    name: Docker image (Linux amd64)
    needs: [python, rust, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build image
        env:
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          docker build --platform linux/amd64 --tag herdr-web:ci \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.licenses=Apache-2.0" .
      - name: Smoke-test automatic startup and shutdown
        run: python3 test/docker_smoke.py
      - name: Retain Docker lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docker-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/docker/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish commit image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/$(printf '%s' "$GH_REPO" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag herdr-web:ci "$image:sha-$GH_SHA"
          docker push "$image:sha-$GH_SHA"

  docker-latest:
    name: Update latest Docker tag
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: docker-latest-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Promote current main image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/$(printf '%s' "$GH_REPO" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker pull "$image:sha-$GH_SHA"
          main_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$main_sha" = "$GH_SHA" ]; then
            docker tag "$image:sha-$GH_SHA" "$image:latest"
            docker push "$image:latest"
          fi
